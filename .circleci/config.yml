version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/node:20.18

    steps:
      - checkout

      - run:
          name: Install AWS CLI
          command: |
            sudo apt update
            sudo apt install -y awscli

      - run:
          name: Configure AWS via OIDC
          command: |
            mkdir -p ~/.aws

            echo "${CIRCLE_OIDC_TOKEN}" > /tmp/token

            cat > ~/.aws/config <<EOF
            [profile oidc]
            role_arn=arn:aws:iam::930767549449:role/circleci-cinema-deploy
            web_identity_token_file=/tmp/token
            region=${AWS_REGION}
            EOF

            echo 'export AWS_PROFILE=oidc' >> $BASH_ENV
            source $BASH_ENV

            aws sts get-caller-identity

      - run:
          name: Deploy
          command: |
            npm ci
            npm run build

            aws s3 sync build/ s3://${S3_BUCKET} --delete

            aws cloudfront create-invalidation \
              --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} \
              --paths "/*"

workflows:
  deploy:
    jobs:
      - deploy
