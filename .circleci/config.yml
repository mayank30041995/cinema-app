version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  build-and-deploy:
    docker:
      - image: cimg/node:20.19

    steps:
      - checkout

      - node/install-packages

      - run:
          name: Debug API Key (safe check)
          command: |
            if [ -z "$REACT_APP_API_SECRET" ]; then
              echo "❌ REACT_APP_API_SECRET is NOT set"
              exit 1
            else
              echo "✅ REACT_APP_API_SECRET is set"
            fi

      - run:
          name: Build React App
          command: |
            REACT_APP_API_SECRET=$REACT_APP_API_SECRET npm run build

      - run:
          name: Install AWS CLI
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip awscliv2.zip
            sudo ./aws/install
            aws --version

      - run:
          name: Deploy to S3
          command: |
            aws s3 sync build/ s3://$S3_BUCKET --delete

      - run:
          name: Invalidate CloudFront Cache
          command: |
            aws cloudfront create-invalidation \
              --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
              --paths "/*"

workflows:
  deploy:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only:
                - main
